name: Summer
description: Summer (Summer, PBC) is a financial wellness platform that helps individuals, employers,
  and government organizations manage student loan debt and education expenses. Summer connects members
  with 150+ federal and state loan programs to lower monthly payments, pursue loan forgiveness (including
  Public Service Loan Forgiveness), and build tax-advantaged education savings. It is delivered as an
  employee benefit and through public programs, offering debt optimization, college cost planning,
  tuition assistance, tax-favorable direct student-loan contributions, and retirement matching of loan
  payments. Summer reports over $2B in savings delivered and a 97% member satisfaction rate.
